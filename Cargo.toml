[package]
name = "pithpack"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Compress codebases into token-lean context bundles for LLMs"
license = "MIT"
repository = "https://github.com/eckorog2005/pithpack"
readme = "README.md"
keywords = ["llm", "context", "tokens", "tree-sitter", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.30"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
