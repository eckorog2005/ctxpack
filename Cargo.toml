[package]
name = "pithpack"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Compress codebases into token-lean context bundles for LLMs"
license = "MIT"
repository = "https://github.com/eckorog2005/pithpack"
readme = "README.md"
keywords = ["llm", "context", "tokens", "tree-sitter", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
